<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de gestão de agenda, clientes, serviços e finanças da JR Barbershop." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="JR Barbershop" />
    <meta property="og:description" content="Sistema de gestão de agenda, clientes, serviços e finanças da JR Barbershop." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>JR Barbershop</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('jr-theme')
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
