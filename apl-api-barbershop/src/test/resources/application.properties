spring.application.name=apl-api-barbershop

spring.datasource.url=jdbc:h2:mem:barbershop
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

brasilapi.base-url=https://brasilapi.com.br
brasilapi.connect-timeout-ms=3000
brasilapi.read-timeout-ms=5000
