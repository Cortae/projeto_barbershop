spring.application.name=apl-api-barbershop

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_barbershop?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:barbershop_app}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

brasilapi.base-url=https://brasilapi.com.br
brasilapi.connect-timeout-ms=3000
brasilapi.read-timeout-ms=5000
